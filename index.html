function settingsPage(m){return `${supabasePanel()}<section class="panel"><div class="panelhead"><h2>Saldo awal per akun</h2><span>Saldo fisik tepat sebelum transaksi pertama yang dicatat</span></div><div class="notice">Saldo awal adalah saldo yang Anda masukkan sebagai titik mulai. Saldo awal gabungan untuk periode terpilih menambahkan saldo awal akun dan seluruh transaksi neto yang terjadi sebelum periode tersebut. Saldo akhir akun = saldo awal periode + pemasukan/transfer masuk − pengeluaran/transfer keluar dalam periode. Sheet Gaji tidak dihitung sebagai akun.</div><div class="settingsgrid">${balanceAccounts().map(a=>`<label class="field"><span>${icons[a]||'◉'} ${esc(a)}</span><input class="openingInput" data-account="${esc(a)}" type="number" min="0" value="${Number(state.opening[a]||0)}"></label>`).join('')}</div><button class="btn" id="saveOpenings" style="margin-top:14px">Simpan saldo awal</button></section><div style="height:15px"></div><section class="panel"><div class="panelhead"><h2>Data demo</h2><span>Transaksi awal dikosongkan agar siap Anda isi</span></div><p class="sub">Saat ini ${personalTransactions().length} transaksi pribadi dan ${state.transactions.filter(t=>t.workspace==='Kantorku').length} transaksi Rosario tersimpan. Contoh workbook hanya memengaruhi transaksi pribadi.</p><div class="settingsactions"><button class="btn secondary" id="loadExamples">Muat contoh transaksi workbook</button><button class="btn danger" id="clearTransactions">Reset transaksi</button><button class="btn danger" id="resetAll">Reset seluruh data</button></div><div class="tiny" style="margin-top:12px">Reset transaksi menghapus seluruh transaksi. Reset seluruh data menghapus transaksi, saldo awal, dan target tambahan serta mengembalikan anggaran/target workbook. Tindakan reset tidak dapat dibatalkan.</div></section>`}
function bindPage(){bindSupabasePanel();bindReceiptExtras();$('#refreshOverview')?.addEventListener('click',()=>{render();toast('Ringkasan diperbarui')});$('#addCashBalance')?.addEventListener('click',()=>{openModal(null,selectedAccount);$('#txForm').elements.flow.value='Transfer Masuk';$('#txForm').elements.category.value='Uang Cash';refreshSubcategories('Uang Cash');$('#txForm').elements.note.value='Tambahan saldo tunai'});$('#openBcaImport')?.addEventListener('click',()=>$('#bcaCsvInput').click());$('#bcaCsvInput')?.addEventListener('change',e=>{if(e.target.files[0])showBcaCsvImport(e.target.files[0])});document.querySelectorAll('[data-rosario-tab]').forEach(b=>b.onclick=()=>{rosarioTab=b.dataset.rosarioTab;render()});document.querySelectorAll('[data-rosario-mode]').forEach(b=>b.onclick=()=>{rosarioSummaryMode=b.dataset.rosarioMode;render()});$('#addKantorkuTx')?.addEventListener('click',()=>openModal(null,null,'Kantorku'));$('#exportKantorku')?.addEventListener('click',()=>exportTransactions(null,'Kantorku'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{summaryMode=b.dataset.mode;render()});document.querySelectorAll('[data-tx-mode]').forEach(b=>b.onclick=()=>{transactionRange=b.dataset.txMode;render()});document.querySelectorAll('.addCash').forEach(b=>b.onclick=()=>{openModal(null,b.dataset.account);$('#txForm').elements.flow.value='Transfer Masuk';$('#txForm').elements.category.value='Uang Cash';refreshSubcategories('Uang Cash');$('#txForm').elements.note.value='Tambahan saldo tunai'});document.querySelectorAll('.exportAccount').forEach(b=>b.onclick=()=>exportTransactions(b.dataset.account));$('#scanReceipt')?.addEventListener('click',scanReceipt);$('#saveReceiptDraft')?.addEventListener('click',saveReceipt);$('#clearReceiptDraft')?.addEventListener('click',clearReceipt);$('#testGemini')?.addEventListener('click',testGeminiConnection);$('#saveGeminiSettings')?.addEventListener('click',saveGeminiSettings);$('#openReceiptCamera')?.addEventListener('click',()=>$('#receiptCamera').click());$('#rememberGeminiKey')?.addEventListener('change',e=>{const key=$('#geminiKey').value.trim();if(e.target.checked&&key)localStorage.setItem(GEMINI_KEY_STORAGE,key);else if(!e.target.checked)localStorage.removeItem(GEMINI_KEY_STORAGE)});$('#geminiKey')?.addEventListener('change',()=>{if($('#rememberGeminiKey')?.checked&&$('#geminiKey').value.trim())localStorage.setItem(GEMINI_KEY_STORAGE,$('#geminiKey').value.trim())});$('#forgetGeminiKey')?.addEventListener('click',()=>{localStorage.removeItem(GEMINI_KEY_STORAGE);$('#geminiKey').value='';$('#rememberGeminiKey').checked=false;toast('API key tersimpan dihapus')});['receiptFile','receiptCamera'].forEach(id=>$('#'+id)?.addEventListener('change',e=>{const other=id==='receiptFile'?'receiptCamera':'receiptFile';$('#'+other).value='';showReceiptPreview(e.target.files[0]);if(e.target.files[0])scanReceipt()}));$('#exportTransactions')?.addEventListener('click',()=>exportTransactions(selectedAccount==='Semua akun'?null:selectedAccount));$('#exportBudget')?.addEventListener('click',exportBudgets);document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.querySelectorAll('.accounttabs [data-account]').forEach(b=>b.onclick=()=>{selectedAccount=b.dataset.account;render()});document.querySelectorAll('.deleteTx').forEach(b=>b.onclick=()=>{if(!confirm('Hapus transaksi ini?'))return;state.transactions=state.transactions.filter(t=>t.id!==b.dataset.id);save();render();toast('Transaksi dihapus')});document.querySelectorAll('.editTx').forEach(b=>b.onclick=()=>openModal(b.dataset.id));$('#addTx')?.addEventListener('click',()=>openModal());$('#saveBudgets')?.addEventListener('click',()=>{document.querySelectorAll('.itemQty').forEach(x=>state.budgetItems[+x.dataset.index].quantity=Math.max(0,Number(x.value)||0));document.querySelectorAll('.itemPrice').forEach(x=>state.budgetItems[+x.dataset.index].unitPrice=Math.max(0,Math.round(Number(x.value)||0)));state.budgets.forEach(b=>{const rows=state.budgetItems.filter(x=>x.category===b.category);if(rows.length)b.limit=rows.reduce((n,x)=>n+x.quantity*x.unitPrice,0)});save();render();toast('Anggaran per item disimpan')});$('#saveOpenings')?.addEventListener('click',()=>{document.querySelectorAll('.openingInput').forEach(x=>state.opening[x.dataset.account]=Number(x.value)||0);save();render();toast('Saldo awal disimpan')});$('#clearTransactions')?.addEventListener('click',()=>{if(!confirm('Yakin reset semua transaksi pribadi? Data Rosario tetap disimpan.'))return;state.transactions=state.transactions.filter(t=>t.workspace==='Kantorku');save();render();toast('Semua transaksi direset')});$('#resetAll')?.addEventListener('click',()=>{if(!confirm('Reset seluruh data termasuk transaksi, saldo awal, target, anggaran, dan API key Gemini tersimpan?'))return;state=blankState();localStorage.removeItem(GEMINI_KEY_STORAGE);save();render();toast('Seluruh data direset')});$('#loadExamples')?.addEventListener('click',()=>{if(!confirm('Muat ulang contoh transaksi dari workbook? Transaksi pribadi saat ini akan diganti; data Rosario tetap disimpan.'))return;state.transactions=[...state.transactions.filter(t=>t.workspace==='Kantorku'),...structuredClone(SEED.transactions)];save();render();toast('Contoh transaksi dimuat')});document.querySelectorAll('.delGoal').forEach(b=>b.onclick=()=>{if(!confirm('Hapus target ini?'))return;state.goals.splice(+b.dataset.index,1);save();render()});document.querySelectorAll('.editGoal').forEach(b=>b.onclick=()=>openGoalModal(+b.dataset.index));$('#addGoal')?.addEventListener('click',()=>openGoalModal())}
function openGoalModal(index=null){editingGoalIndex=index;const f=$('#goalForm');f.reset();$('#goalFormTitle').textContent=index===null?'Tambah target':'Edit target';if(index!==null){const g=state.goals[index];f.elements.name.value=g.name||'';f.elements.target.value=Number(g.target)||'';f.elements.saved.value=Number(g.saved)||0;f.elements.date.value=g.date||''}$('#goalModal').classList.add('open')}
function refreshSubcategories(category,selected=''){const list=SEED.subcategories[category]||[];$('#subcategoryOptions').innerHTML=list.map(x=>`<option value="${esc(x)}"></option>`).join('');$('#detailInput').value=selected||''}
function openModal(id=null,defaultAccount=null,workspace=null){editingId=id;const oldTx=id?state.transactions.find(x=>x.id===id):null;editingWorkspace=workspace||oldTx?.workspace||'';const form=$('#txForm');form.reset();$('#formTitle').textContent=id?'Edit transaksi'+(editingWorkspace?' · '+editingWorkspace:''):'Tambah transaksi'+(editingWorkspace?' · '+editingWorkspace:'');const account=$('#accountInput');account.innerHTML=allAccounts().map(a=>`<option>${esc(a)}</option>`).join('');if(defaultAccount)account.value=defaultAccount;const category=$('#categoryInput'),categories=editingWorkspace==='Kantorku'?[...ROSARIO_CATEGORIES]:[...new Set(state.budgets.map(b=>b.category))];if(id){const existing=state.transactions.find(x=>x.id===id);if(existing?.category&&!categories.includes(existing.category))categories.push(existing.category)}category.innerHTML=categories.map(x=>`<option>${esc(x)}</option>`).join('');category.onchange=()=>refreshSubcategories(category.value);$('#txForm').elements.date.value=$('#monthPick').value+'-01';if(id){const t=state.transactions.find(x=>x.id===id);if(t){form.elements.date.value=t.date;form.elements.account.value=t.account;form.elements.flow.value=t.flow;form.elements.category.value=t.category;form.elements.amount.value=t.amount;form.elements.note.value=t.note;refreshSubcategories(t.category,t.detail)}}else refreshSubcategories(category.value);$('#modal').classList.add('open')}
function exportTransactions(account=null,workspace=null){const rows=[['Tanggal','Akun / Sheet','Jenis','Kategori','Subkategori','Keterangan','Jumlah (Rp)','Nama Toko','Subtotal (Rp)','Diskon (Rp)','Pajak/PPN (Rp)'],...state.transactions.filter(t=>workspace?t.workspace===workspace:t.workspace!=='Kantorku'&&(!account||t.account===account)).map(t=>[t.date,t.account,t.flow,t.category,t.detail,t.note,t.amount,t.merchant||'',t.subtotal||0,t.discount||0,t.tax||0])];const suffix=workspace?'-'+workspace.toLowerCase().replaceAll(' ','-'):account?'-'+account.toLowerCase().replaceAll(' ','-'):'';csvDownload(`transaksi${suffix}.csv`,rows)}
function exportBudgets(){const rows=[['Sheet kategori','Nama item','Jumlah','Harga satuan (Rp)','Anggaran item (Rp)'],...state.budgetItems.map(x=>[x.category,x.name,x.quantity,x.unitPrice,x.quantity*x.unitPrice])];csvDownload('anggaran-keluarga.csv',rows)}
function csvDownload(filename,rows){const text='\uFEFF'+rows.map(r=>r.map(v=>{let value=String(v??'');if(typeof v!=='number'&&/^[\t\r\n ]*[=+@-]/.test(value))value="'"+value;return '"'+value.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
$('#monthPick').addEventListener('change',()=>{syncPeriodControls();render()});$('#monthFilter').addEventListener('change',()=>{$('#monthPick').value=$('#yearFilter').value+'-'+$('#monthFilter').value;render()});$('#yearFilter').addEventListener('change',()=>{$('#monthPick').value=$('#yearFilter').value+'-'+$('#monthFilter').value;render()});$('#closeGoalModal').onclick=$('#cancelGoalModal').onclick=()=>$('#goalModal').classList.remove('open');$('#goalForm').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget,g={name:f.elements.name.value.trim(),target:Number(f.elements.target.value),saved:Math.max(0,Number(f.elements.saved.value)||0),date:f.elements.date.value};if(!g.name||g.target<=0){toast('Isi nama dan target yang benar');return}if(editingGoalIndex===null)state.goals.push(g);else state.goals[editingGoalIndex]=g;save();$('#goalModal').classList.remove('open');render();toast('Target disimpan')});$('#closeModal').onclick=$('#cancelModal').onclick=()=>{$('#modal').classList.remove('open');editingId=null;editingWorkspace=''};$('#txForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget),existingRecord=editingId?state.transactions.find(t=>t.id===editingId):null,record={...(existingRecord||{}),id:editingId||'tx-'+Date.now(),date:d.get('date'),account:d.get('account'),flow:d.get('flow'),category:d.get('category'),note:d.get('note'),detail:d.get('detail'),amount:Number(d.get('amount')),workspace:editingWorkspace};if(editingId)state.transactions=state.transactions.map(t=>t.id===editingId?record:t);else state.transactions.push(record);save();revealTx(record);$('#modal').classList.remove('open');editingId=null;editingWorkspace='';if(record.workspace==='Kantorku'){page='rosario';rosarioTab='transactions'}else page='transactions';render();toast('Transaksi tersimpan otomatis')});window.addEventListener('storage',e=>{if(e.key===KOS_STORAGE_KEY&&page==='dashboard')render()});
